<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería - Bachillerato Contable</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f5f3;
        }

        header {
            background: #0b3d2e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .galeria {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .foto {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .foto img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .foto p {
            text-align: center;
            color: #0b3d2e;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 12px 25px;
            background: #16805c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .volver:hover {
            background: #0b3d2e;
        }

        footer {
            background: #0b3d2e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }


        /* CELULAR */

        @media (max-width: 700px) {

            .galeria {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .foto img {
                height: 160px;
            }

        }

        @media (max-width: 450px) {

            .galeria {
                grid-template-columns: 1fr;
            }

            .foto img {
                height: 220px;
            }

        }

    </style>

</head>


<body>


    <header>

        <h1>📸 Galería de Fotos</h1>

        <p>Bachillerato Técnico Vocacional Administrativo Contable</p>

    </header>

</body>
