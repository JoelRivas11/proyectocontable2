<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Formulario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            padding: 80px 20px;
        }

        .contenedor {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #00000030;
        }

        h1 {
            color: #1a73e8;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .boton {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
        }

        .boton:hover {
            background-color: #1558a6;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>Formulario de Encuesta</h1>

        <p>
            Bienvenido. Haz clic en el siguiente botón
            para responder la encuesta.
        </p>

        <a class="boton"
           href="https://docs.google.com/forms/d/e/1FAIpQLSebwAaBl963jYw60471HWmy4_rQM0wpQa1uOy6jNXHXDbmyiA/viewform?usp=header"
           target="_blank"
           rel="noopener noreferrer">
            Responder encuesta
        </a>
    </div>

</body>
</html>
